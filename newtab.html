<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <img class="brand-mark" src="icons/icon48.png" alt="" width="38" height="38">
            <h1>Tab Overview</h1>
          </div>

          <div class="page-tabs" id="source-switch" role="tablist" aria-label="Tabs to show">
            <button type="button" role="tab" class="page-tab source-button is-active" data-source="open" aria-selected="true">Open tabs <span class="source-count" id="open-count"></span></button>
            <button type="button" role="tab" class="page-tab source-button" data-source="archive" aria-selected="false" tabindex="-1">Archive <span class="source-count" id="archive-count"></span></button>
          </div>

          <div class="search">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="m13.2 13.2 3.3 3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search tabs"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search tabs"
            >
            <kbd aria-hidden="true">/</kbd>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <div class="view-switch" role="group" aria-label="View">
          <button type="button" class="view-button is-active" data-view="windows" aria-pressed="true">Windows</button>
          <button type="button" class="view-button" data-view="sorted" aria-pressed="false">Sorted</button>
        </div>

        <p class="summary" id="summary" aria-live="polite">Reading your tabs…</p>

        <div class="toolbar-actions">
          <button type="button" class="button" id="groups-add" hidden>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            New group
          </button>
          <button type="button" class="button" id="archive-export" title="Save the archive and your custom groups to a file" hidden>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export
          </button>
          <button type="button" class="button" id="archive-import" hidden>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10.5v-8M4.5 6 8 2.5 11.5 6M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Import
          </button>
          <input type="file" id="archive-import-file" accept="application/json,.json" hidden>
          <button type="button" class="button is-primary" id="archive-all" hidden>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="3" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M3 6v6.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Archive all
          </button>
        </div>
      </div>

      <div class="banner-slot" id="banner" role="status" aria-live="polite" hidden></div>

      <main class="overview" id="overview"></main>

      <footer class="footer">
        <span><span id="footer-hint">Click a tab to switch to it</span> · Press <kbd>/</kbd> to search</span>
        <span>Everything stays in your browser. Nothing is sent anywhere.</span>
      </footer>
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
